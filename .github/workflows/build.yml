name: Build BumbleDarkMode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid
          brew install make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Build BumbleDarkMode
        run: |
          export THEOS="$HOME/theos"
          make clean
          make          # <- Changed: removed "package FINALPACKAGE=1"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: BumbleDarkMode-dylib
          path: .theos/obj/*.dylib