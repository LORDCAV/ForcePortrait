name: Build Tweak
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos Environment
        uses: beerpiss/theos-action@v1

      - name: Compile Library Binary
        run: |
          make FINALPACKAGE=1
          mkdir -p shared_out
          
          # Universal root path check to catch the binary automatically
          if [ -f ".theos/obj/BumbleLock.dylib" ]; then
            cp .theos/obj/BumbleLock.dylib shared_out/BumbleLock.dylib
          elif [ -f ".theos/obj/debug/BumbleLock.dylib" ]; then
            cp .theos/obj/debug/BumbleLock.dylib shared_out/BumbleLock.dylib
          else
            find .theos/obj/ -name "BumbleLock.dylib" -exec cp {} shared_out/BumbleLock.dylib \;
          fi

      - name: Dispatch Package
        uses: actions/upload-artifact@v4
        with:
          name: BumbleLock-Tweak
          path: shared_out/BumbleLock.dylib
