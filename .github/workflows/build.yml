name: Build BumbleDarkMode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid
          brew install make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Build BumbleDarkMode
        run: |
          export THEOS="$HOME/theos"
          make clean
          make

      - name: Debug - Show all files
        run: |
          echo "=== Current directory ==="
          ls -la
          echo ""
          echo "=== .theos directory ==="
          ls -la .theos/ 2>/dev/null || echo "No .theos directory"
          echo ""
          echo "=== .theos/obj directory ==="
          ls -la .theos/obj/ 2>/dev/null || echo "No .theos/obj directory"
          echo ""
          echo "=== Find all .dylib files ==="
          find . -name "*.dylib" -type f 2>/dev/null || echo "No dylib found"

      - name: Upload all files (debug)
        uses: actions/upload-artifact@v4
        with:
          name: full-build
          path: ./

      - name: Upload dylib specifically
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BumbleDarkMode-dylib
          path: |
            .theos/obj/*.dylib
            *.dylib
            .theos/obj/debug/*.dylib
          if-no-files-found: warn