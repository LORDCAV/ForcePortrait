name: Build Tweak
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos Environment
        uses: beerpiss/theos-action@v1
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1' # Prevents the gtar caching loop from freezing
        with:
          theos-sdks: https://github.com

      - name: Compile Library Binary
        run: |
          make FINALPACKAGE=1
          mkdir -p shared_out
          cp .theos/obj/BumbleLock.dylib shared_out/BumbleLock.dylib

      - name: Dispatch Package
        uses: actions/upload-artifact@v4
        with:
          name: BumbleLock-Tweak
          path: shared_out/BumbleLock.dylib
