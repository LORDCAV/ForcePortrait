name: Build Dylib
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos Build Environment
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Build Tweak
        run: |
          make FINALPACKAGE=1

      - name: Locate and Rename Dylib
        run: |
          mkdir -p output
          cp .theos/obj/debug/BumbleLock.dylib output/BumbleLock.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BumbleLock-Dylib
          path: output/BumbleLock.dylib
