name: Build BumbleDarkMode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid
          brew install make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Build BumbleDarkMode
        run: |
          export THEOS="$HOME/theos"
          echo "=== Starting build ==="
          make clean
          make
          
          echo ""
          echo "=== BUILD COMPLETE - CHECKING FILES ==="
          echo ""
          
          # Show everything in the project
          echo "=== All files in current directory ==="
          ls -la
          echo ""
          
          echo "=== .theos directory ==="
          ls -la .theos/ 2>/dev/null || echo "❌ .theos/ directory not found"
          echo ""
          
          echo "=== .theos/obj directory ==="
          ls -la .theos/obj/ 2>/dev/null || echo "❌ .theos/obj/ directory not found"
          echo ""
          
          echo "=== Searching for ANY .dylib file ==="
          find . -name "*.dylib" -type f 2>/dev/null || echo "❌ No .dylib found anywhere"
          echo ""
          
          echo "=== Searching for ANY .deb file ==="
          find . -name "*.deb" -type f 2>/dev/null || echo "❌ No .deb found"
          echo ""
          
          echo "=== Full directory tree ==="
          find . -type f | head -50

      - name: Upload EVERYTHING as debug
        uses: actions/upload-artifact@v4
        with:
          name: debug-full-build
          path: ./

      - name: Upload dylib if found
        uses: actions/upload-artifact@v4
        with:
          name: BumbleDarkMode-dylib
          path: |
            .theos/obj/*.dylib
            **/*.dylib
          if-no-files-found: warn